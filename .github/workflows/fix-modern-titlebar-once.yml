name: Fix modern title bar once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Replace tool-window chrome with standard Windows chrome
        shell: pwsh
        run: |
          $path = 'src/win/pin.rs'
          $content = Get-Content -Raw -Encoding UTF8 $path

          $content = $content.Replace(
            'WM_NCDESTROY, WM_PAINT, WNDCLASSEXW, WS_CAPTION, WS_EX_LAYERED, WS_EX_TOOLWINDOW,`r`n    WS_EX_TOPMOST, WS_SYSMENU,',
            'WM_NCDESTROY, WM_PAINT, WNDCLASSEXW, WS_EX_LAYERED, WS_EX_NOACTIVATE, WS_EX_TOPMOST,`r`n    WS_OVERLAPPEDWINDOW,'
          )
          $content = $content.Replace(
            'const PIN_WINDOW_STYLE: u32 = WS_CAPTION | WS_SYSMENU;',
            'const PIN_WINDOW_STYLE: u32 = WS_OVERLAPPEDWINDOW;'
          )
          $content = $content.Replace(
            'const PIN_WINDOW_EX_STYLE: u32 = WS_EX_LAYERED | WS_EX_TOOLWINDOW | WS_EX_TOPMOST;',
            'const PIN_WINDOW_EX_STYLE: u32 = WS_EX_LAYERED | WS_EX_NOACTIVATE | WS_EX_TOPMOST;'
          )

          if ($content -match 'WS_EX_TOOLWINDOW' -or $content -match 'WS_CAPTION \| WS_SYSMENU') {
            throw 'The title-bar style replacement did not complete.'
          }

          Set-Content -Encoding UTF8 -NoNewline $path $content
          cargo fmt --all

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release

      - name: Commit validated title bar update
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/fix-modern-titlebar-once.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use standard Windows title bar for pinned images'
          git push origin HEAD:main
