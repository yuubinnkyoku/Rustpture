name: Fix Clippy once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}:\n{old}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/win/bitmap.rs",
              "        let result = if EmptyClipboard() == 0 {\n            Err(io::Error::last_os_error())\n        } else if SetClipboardData(u32::from(CF_BITMAP), copy).is_null() {\n            Err(io::Error::last_os_error())\n        } else {\n            Ok(())\n        };",
              "        let result = if EmptyClipboard() == 0\n            || SetClipboardData(u32::from(CF_BITMAP), copy).is_null()\n        {\n            Err(io::Error::last_os_error())\n        } else {\n            Ok(())\n        };",
          )

          replace(
              "src/win/controller.rs",
              "pub unsafe fn register_class(instance: HINSTANCE) -> io::Result<()> {\n    let class_name = wide_null(CONTROLLER_CLASS);\n    let embedded_icon = LoadIconW(instance, 1usize as *const u16);",
              "#[allow(clippy::manual_dangling_ptr)]\npub unsafe fn register_class(instance: HINSTANCE) -> io::Result<()> {\n    let class_name = wide_null(CONTROLLER_CLASS);\n    // Win32's MAKEINTRESOURCEW convention encodes a numeric resource ID\n    // in a pointer value; the pointer is never dereferenced.\n    let embedded_icon = LoadIconW(instance, 1usize as *const u16);",
          )

          replace(
              "src/win/pin.rs",
              "    if key_state & (MK_CONTROL as u32) != 0 {",
              "    if key_state & MK_CONTROL != 0 {",
          )
      - name: Format
        run: cargo fmt --all
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/win/bitmap.rs src/win/controller.rs src/win/pin.rs
          git commit -m "Resolve Clippy warnings"
          git push
