name: Patch aspect ratio handling once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-pin-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Move aspect-ratio constraint into the pin window procedure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pin_path = Path('src/win/pin.rs')
          s = pin_path.read_text()

          old_import = '''    WM_LBUTTONUP, WM_MOUSEMOVE, WM_MOUSEWHEEL, WM_NCDESTROY, WM_PAINT, WM_SIZE, WNDCLASSEXW,
    WS_EX_APPWINDOW, WS_EX_LAYERED, WS_EX_NOACTIVATE, WS_EX_TOPMOST, WS_OVERLAPPEDWINDOW,
'''
          new_import = '''    WM_LBUTTONUP, WM_MOUSEMOVE, WM_MOUSEWHEEL, WM_NCDESTROY, WM_PAINT, WM_SIZE, WM_SIZING,
    WMSZ_BOTTOM, WMSZ_BOTTOMLEFT, WMSZ_BOTTOMRIGHT, WMSZ_LEFT, WMSZ_RIGHT, WMSZ_TOP, WMSZ_TOPLEFT,
    WMSZ_TOPRIGHT, WNDCLASSEXW, WS_EX_APPWINDOW, WS_EX_LAYERED, WS_EX_NOACTIVATE, WS_EX_TOPMOST,
    WS_OVERLAPPEDWINDOW,
'''
          if old_import not in s:
              raise SystemExit('pin import anchor not found')
          s = s.replace(old_import, new_import, 1)

          old_arm = '''        WM_SIZE => {
            if wparam != SIZE_MINIMIZED as usize {
                sync_scale_from_client(window);
                // The bitmap is scaled to the whole client area. A resize therefore
                // changes every destination pixel, not only the newly exposed strip.
                InvalidateRect(window, null(), 0);
            }
            0
        }
'''
          new_arm = old_arm + '''        WM_SIZING => {
            if lparam != 0 {
                constrain_sizing(window, wparam as u32, lparam as *mut RECT);
            }
            1
        }
'''
          if old_arm not in s:
              raise SystemExit('WM_SIZE anchor not found')
          s = s.replace(old_arm, new_arm, 1)

          anchor = '''unsafe fn sync_scale_from_client(window: HWND) {
'''
          helper = '''unsafe fn constrain_sizing(window: HWND, edge: u32, proposed: *mut RECT) {
    if proposed.is_null() {
        return;
    }

    let pointer = state_ptr(window);
    if pointer.is_null() {
        return;
    }

    let source_width = (*pointer).bitmap.width().max(1);
    let source_height = (*pointer).bitmap.height().max(1);
    let ratio = source_width as f64 / source_height as f64;
    let (frame_width, frame_height) = window_frame_size();
    let rect = &mut *proposed;
    let client_width = ((rect.right - rect.left) - frame_width).max(1);
    let client_height = ((rect.bottom - rect.top) - frame_height).max(1);

    let width_drives = match edge {
        WMSZ_LEFT | WMSZ_RIGHT => true,
        WMSZ_TOP | WMSZ_BOTTOM => false,
        WMSZ_TOPLEFT | WMSZ_TOPRIGHT | WMSZ_BOTTOMLEFT | WMSZ_BOTTOMRIGHT => {
            let height_from_width = (client_width as f64 / ratio).round() as i32;
            let width_from_height = (client_height as f64 * ratio).round() as i32;
            (height_from_width - client_height).abs() <= (width_from_height - client_width).abs()
        }
        _ => return,
    };

    if width_drives {
        let target_client_height = (client_width as f64 / ratio).round().max(1.0) as i32;
        let target_height = target_client_height + frame_height;
        if matches!(edge, WMSZ_TOP | WMSZ_TOPLEFT | WMSZ_TOPRIGHT) {
            rect.top = rect.bottom - target_height;
        } else {
            rect.bottom = rect.top + target_height;
        }
    } else {
        let target_client_width = (client_height as f64 * ratio).round().max(1.0) as i32;
        let target_width = target_client_width + frame_width;
        if matches!(edge, WMSZ_LEFT | WMSZ_TOPLEFT | WMSZ_BOTTOMLEFT) {
            rect.left = rect.right - target_width;
        } else {
            rect.right = rect.left + target_width;
        }
    }
}

'''
          if anchor not in s:
              raise SystemExit('helper insertion anchor not found')
          s = s.replace(anchor, helper + anchor, 1)
          pin_path.write_text(s)

          Path('src/win/lifecycle.rs').write_text('''use std::ptr::{null, null_mut};

use windows_sys::Win32::Foundation::{HWND, LPARAM, LRESULT, WPARAM};
use windows_sys::Win32::System::Threading::GetCurrentThreadId;
use windows_sys::Win32::UI::WindowsAndMessaging::{
    CWPSTRUCT, CallNextHookEx, FindWindowW, GetClassNameW, PostMessageW, SetWindowsHookExW,
    WH_CALLWNDPROC, WM_CREATE, WM_NCDESTROY, WM_SHOWWINDOW,
};

use super::wide::wide_null;
use super::{
    CONTROLLER_CLASS, OVERLAY_CLASS, PIN_CLASS, WM_APP_CAPTURE_FINISHED, WM_APP_PIN_CLOSED,
    WM_APP_PIN_OPENED,
};

const CLASS_NAME_CAPACITY: usize = 64;

pub unsafe fn install_current_thread_hook() {
    // This hook only observes windows created on Rustpture's GUI thread. Windows
    // removes it automatically when that thread exits.
    let _ = SetWindowsHookExW(
        WH_CALLWNDPROC,
        Some(call_wnd_proc),
        null_mut(),
        GetCurrentThreadId(),
    );
}

unsafe extern "system" fn call_wnd_proc(code: i32, wparam: WPARAM, lparam: LPARAM) -> LRESULT {
    if code >= 0 && lparam != 0 {
        let info = &*(lparam as *const CWPSTRUCT);
        let class = window_class(info.hwnd);

        if class.as_deref() == Some(PIN_CLASS) {
            if info.message == WM_CREATE {
                notify_controller(WM_APP_PIN_OPENED);
            } else if info.message == WM_NCDESTROY {
                notify_controller(WM_APP_PIN_CLOSED);
            }
        } else if class.as_deref() == Some(OVERLAY_CLASS)
            && info.message == WM_SHOWWINDOW
            && info.wParam == 0
        {
            notify_controller(WM_APP_CAPTURE_FINISHED);
        }
    }

    CallNextHookEx(null_mut(), code, wparam, lparam)
}

unsafe fn notify_controller(message: u32) {
    let class_name = wide_null(CONTROLLER_CLASS);
    let controller = FindWindowW(class_name.as_ptr(), null());
    if !controller.is_null() {
        PostMessageW(controller, message, 0, 0);
    }
}

unsafe fn window_class(window: HWND) -> Option<String> {
    let mut buffer = [0u16; CLASS_NAME_CAPACITY];
    let length = GetClassNameW(
        window,
        buffer.as_mut_ptr(),
        buffer.len().try_into().unwrap_or(i32::MAX),
    );
    if length <= 0 {
        return None;
    }
    String::from_utf16(&buffer[..length as usize]).ok()
}
''')
          PY

          cargo fmt --all

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/win/pin.rs src/win/lifecycle.rs
          git commit -m 'Handle aspect-ratio resizing in pin window procedure'
          git push origin HEAD:main
