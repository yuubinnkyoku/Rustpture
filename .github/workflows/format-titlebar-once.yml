name: Format title bar change once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format source
        shell: pwsh
        run: cargo fmt --all
      - name: Commit formatting and remove this workflow
        shell: pwsh
        run: |
          git rm .github/workflows/format-titlebar-once.yml
          git add src/win/pin.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format title bar implementation"
          git push
